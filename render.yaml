services:
  - type: web
    runtime: docker
    name: fixcampus-api
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: DDL_AUTO
        value: update
      - key: SEED_ENABLED
        value: "true"
      - key: SEED_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: fixcampus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fixcampus-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fixcampus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: fixcampus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fixcampus-db
          property: password
      - key: FRONTEND_URL
        value: https://fixcampus-web.onrender.com

  - type: web
    runtime: static
    name: fixcampus-web
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist/frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fixcampus-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: fixcampus-db
    plan: 0.1c-256mb
    region: oregon
