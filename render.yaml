services:
  - type: web
    runtime: docker
    name: fixcampus-api
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: DDL_AUTO
        value: update
      - key: SEED_ENABLED
        value: "true"
      - key: SEED_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fixcampus-db
          property: connectionString

  - type: web
    runtime: static
    name: fixcampus-web
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist/fixcampus/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fixcampus-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: fixcampus-db
    plan: 0.1c-256mb
    region: oregon
