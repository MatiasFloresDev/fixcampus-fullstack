spring.application.name=fixcampus
server.port=${PORT:8081}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fixcampus;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
fixcampus.seed.enabled=${SEED_ENABLED:true}
fixcampus.seed.password=${SEED_PASSWORD:FixCampus2026!}
fixcampus.ai.url=${AI_URL:https://api.openai.com/v1/chat/completions}
fixcampus.ai.key=${AI_API_KEY:}
fixcampus.ai.model=${AI_MODEL:gpt-4o-mini}
fixcampus.email.key=${RESEND_API_KEY:}
fixcampus.email.from=${EMAIL_FROM:}




